# Sanity check: Stage 1 ALIGNMENT, DDP (no DeepSpeed), 4 nodes (16 GPUs), ~10 min
# 7-expert MultiMeditron-8B with full production modality config and full datasets
# Stage 1 freezes the LLM — only projection + PEP attention trained (~200M params)
# Memory fits comfortably on 4 GPUs without sharding.
# Submit: sbatch --nodes 4 --time 00:30:00 sbatch_train.sh cookbook/sft/moe/attn/pep/stage1_sanitycheck_ddp.yaml

base_llm: /capstor/store/cscs/swissai/a127/meditron/hf_cache/hub/models--OpenMeditron--Meditron3-8B/snapshots/15914bcb040cd1a4f263afcd85b84f09ad2efd95
base_model: null
resume_from_checkpoint: false
attachment_token: <|reserved_special_token_0|>
tokenizer_type: llama
token_size: 4096
truncation: true
max_sequence_length: 4096

loaders:
  - loader_type: raw-image
    modality_type: image

modalities:
  - model_type: moe_meditron_clip_pep
    image_processor: /users/surech/meditron/MultiMeditron/models/CLIP/clip-vit-base-patch32
    hidden_size: 4096
    expert_clip_names:
      - /users/surech/meditron/MultiMeditron/models/CLIP/ClosedMeditron/MedExpert-CT
      - /users/surech/meditron/MultiMeditron/models/CLIP/ClosedMeditron/MedExpert-MRI
      - /capstor/store/cscs/swissai/a127/meditron/models/CLIP/UltraSoundCLIP/checkpoint-4350
      - /users/surech/meditron/MultiMeditron/models/CLIP/ClosedMeditron/MedExpert-Xray
      - /capstor/store/cscs/swissai/a127/meditron/models/openai/clip-vit-base-patch32
      - /capstor/store/cscs/swissai/a127/meditron/models/CLIP/OphthalmologyExpert
      - /capstor/store/cscs/swissai/a127/meditron/models/CLIP/SkinExpert
    generalist_idx: -1
    gating_path: /users/surech/meditron/MultiMeditron/models/CLIP/MultiMeditron-Gating
    fusion_method: cross_attn
    top_k_experts: 5

training_mode: ALIGNMENT

datasets:
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/arrow/llava_pretrain_cleaned
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/arrow/pixmo_anything
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/arrow/pixmo_cap
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/arrow/medtrinity_conversations_1_formatted_alignment
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/arrow/eye_dataset_converted
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/arrow/skin_dataset_converted

training_args:
  output_dir: /iopsstor/scratch/cscs/surech/multimeditron/checkpoints/sanitycheck/stage1-ddp
  run_name: sanity-7exp-stage1-ddp
  dataloader_num_workers: 16
  dataloader_prefetch_factor: 16
  remove_unused_columns: false
  ddp_find_unused_parameters: true
  learning_rate: 1.0e-5
  bf16: true
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 200
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: true
  save_strategy: "no"
  max_grad_norm: 1.0
  dataloader_pin_memory: true
  accelerator_config:
    dispatch_batches: false
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1.0e-6
  report_to: wandb
  logging_steps: 1
  weight_decay: 0.01
