base_llm: meta-llama/Llama-3.1-8B-Instruct
base_model: /capstor/store/cscs/swissai/a127/homes/meditron/models/multimeditron/freeze/moe_avg_shared/MultiMeditron-8B-moe-avg-shared-alignment
attachment_token: <|reserved_special_token_0|>
tokenizer_type: llama
token_size: 4096

# Save VRAM
truncation: True
max_sequence_length: 4096

loaders:
  - loader_type: raw-image
    modality_type: image

modalities:
  - model_type: moe_meditron_clip
    image_processor: openai/clip-vit-base-patch32
    hidden_size: 4096
    expert_clip_names:
      - ClosedMeditron/MedExpert-CT
      - ClosedMeditron/clip-vit-base-patch32
      - ClosedMeditron/MedExpert-MRI
      - ClosedMeditron/MedExpert-Ultrasound
      - ClosedMeditron/MedExpert-Xray
    gating_path: ClosedMeditron/MultiMeditron-Gating
    fusion_method: weighted_average

training_mode: END2END

datasets:
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/cleaned/image/BUSI
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/cleaned/image/COVID_US
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/cleaned/image/ct2
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/cleaned/image/DDTI
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/cleaned/image/iu_xray
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/cleaned/image/PMC_VQA
  - packed_path: /capstor/store/cscs/swissai/a127/meditron/multimediset/cleaned/image/image_mammoth
 

training_args:
  output_dir: /capstor/store/cscs/swissai/a127/homes/meditron/models/multimeditron/freeze/moe_avg_shared/MultiMeditron-8B-moe-avg-shared-end2end
  dataloader_num_workers: 16  # > 0 not supported for IterableDataset, cf. https://github.com/huggingface/datasets/issues/5984
  dataloader_prefetch_factor: 4
  remove_unused_columns: false
  ddp_find_unused_parameters: false # Test to reduce memory
  learning_rate: 1.0e-5
  bf16: true
  per_device_train_batch_size: 1  # note that training_args.n_gpu and training_args.train_batch_size show faulty values
                                  # with deepspeed -> use deepspeed_plugin instead (besides training_args.distributed_state.num_processes == WORLD_SIZE)
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: true
  save_strategy: steps
  save_steps: 0.25
  max_grad_norm: 1.0
  run_name: MultiMeditron-8B-moe-avg-shared-end2end
  deepspeed: ./config/deepspeed.json
  accelerator_config:
    dispatch_batches: false
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr: 3.0e-6
  report_to: wandb
  logging_steps: 1
  weight_decay: 0.01
