[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimeditron"
version = "0.1.0"
description = "Multimeditron: A Multimodal Foundation Model for Medical Image Understanding"
authors = [
    { name="Michael Zhang", email="michael.zhang@epfl.ch" },
    { name="Guillaume Boyé", email="guillaume.boye@epfl.ch" },
    { name="Alexandre Sallinen", email="alexandre.sallinen@epfl.ch" },
    { name="Fabrice Nemo", email="fabrice.nemo@epfl.ch" },
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy<2.0.0",
    "click",
    "ray[serve]",
    "hydra-core",
    "rich",
    "pydanclick",
    "transformers",
    "einops",
    "clip==0.2.0",
    "pillow>=9.4.0",
    "deepspeed",
    "accelerate",
    "hf_transfer",
    "wandb",
    "deprecated",
    "benchy @ git+https://github.com/lukasgd/benchy.git@slurm",
    "datasets @ git+https://github.com/Androz2091/simon-huggingface-datasets.git"
]

[project.optional-dependencies]
flash-attn = [
    "flash-attn",
]
docs = [
    "shibuya",
    "sphinx<9",
    "sphinx-tabs",
    "sphinx-click",
    "torch",
    "torchvision",
]

experts = [
    # Core model stack 
    "torch~=2.6.0",
    "torchvision~=0.21.0",
    "torchaudio~=2.6.0",

    # HF stack
    "transformers~=4.45.0",
    "accelerate~=1.11.0",

    # Data download
    "kagglehub",

    # Training / perf
    "deepspeed~=0.15.1",
    "flash-attn>=2.4.0,<2.4.3",

    # Vision / med
    "monai>=1.3.2,<1.4",
    "open-clip-torch~=3.2.0",
    "clip>=0.2.0,<0.3",
    "einops>=0.7,<0.9",

    # Utilities / eval
    "pillow>=11.3.0,<12",
    "optuna>=4.6.0,<5",
    "scikit-learn>=1.7.2,<1.8",
    "wandb>=0.23.0,<0.24",
    "tqdm>=4.67.1,<4.68",
    "matplotlib>=3.10.7,<3.11",
]

[project.scripts]
multimeditron = "multimeditron.cli:main_cli"
mm = "multimeditron.cli:main_cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

